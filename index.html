<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カレンダーサイト</title>
    <link rel="stylesheet" href="c-style.css">
</head>
<body class="bg-theme">

    <!-- 🚪 白ベースの上品な大人向けログイン画面 -->
    <div id="loginSection" class="login-wrapper">
        <div class="premium-login-card">
            <h1 class="login-title">🔒 DIARY SERVICE</h1>
            <p class="login-sub-text">クラウド暗号化ファイルにアクセスするため、専用 of 認証キーを入力してください。</p>
            <div class="login-box">
                <input type="password" id="loginKey" placeholder="固有の認証キー（パスワード）を入力...">
                <button id="loginBtn">ログイン</button>
            </div>
            <p id="loginError" class="error-msg"></p>
        </div>
    </div>

    <!-- 📅 メイン画面 -->
    <div id="mainSection" class="app-container hidden">
        <header class="app-header">
            <div class="welcome-area">
                <span class="welcome-neon">WELCOME</span>
                <h2 id="currentUser"></h2>
            </div>
            <div class="global-memo-wrap">
                <textarea id="globalMemo" placeholder="📝 いつでも残せる自由メモ（自動保存）"></textarea>
            </div>
            <button id="logoutBtn">LOGOUT</button>
        </header>

        <div class="calendar-wrapper">
            <div class="calendar-sidebar">
                <div id="calendarMonthEnglish" class="month-eng">February</div>
                <div id="calendarYear" class="year-num">2026</div>
                <div id="calendarMonthNumber" class="month-big">2</div>
                <div class="nav-buttons">
                    <button id="prevMonthBtn">◀</button>
                    <button id="nextMonthBtn">▶</button>
                </div>
            </div>
            <div class="calendar-body">
                <div class="calendar-grid" id="calendarGrid"></div>
            </div>
        </div>
    </div>

    <!-- 📝 画面が大きくなって開くダイナミック日記モーダル -->
    <div id="memoModal" class="modal-wrapper hidden">
        <div class="modal-zoom-container">
            <div class="modal-header">
                <button id="backModalBtn" class="back-btn">◀ 戻る</button>
                <h3 id="modalDateTitle">2026 / 02 / 11</h3>
                <span id="modalHolidayLabel" class="holiday-name"></span>
            </div>
            
            <!-- 🔄 上がタイトル(7文字以下制限)、下が本文のスマートな縦並び配置 -->
            <div class="modal-body-vertical-layout">
                <div class="diary-title-section">
                    <label>📖 日記のタイトル (7文字以下)</label>
                    <input type="text" id="diaryInput" placeholder="タイトルを入力（7文字まで）..." maxlength="7">
                </div>
                <div class="diary-main-section">
                    <label>📌 日記本文</label>
                    <textarea id="memoInput" placeholder="今日の日記を記入..."></textarea>
                </div>
            </div>
        </div>
    </div>

    <!-- 分割パズル形式で順番に読み込む -->
    <script src="c-s.i.js"></script>
    <script src="c-s.h.js"></script>
    <script src="c-s.r.js"></script>
    <script src="c-s.m.js"></script>
</body>
</html>
